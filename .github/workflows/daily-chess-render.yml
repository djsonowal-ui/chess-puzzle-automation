name: Daily Chess Automation

on:
  schedule:
    # 4:00 AM IST (22:30 UTC previous day) - Overnight run to schedule all 4 daily videos
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to render and upload (all, morning, player, afternoon, evening)'
        required: false
        default: 'all'

# Permissions needed to commit changes back to the repository
permissions:
  contents: write

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Node Modules
        run: npm install --legacy-peer-deps

      - name: Setup Headless Chrome for Remotion
        run: npx remotion browser install

      - name: Replenish Puzzles
        run: node replenish.mjs

      - name: Render and Schedule Daily Shorts
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          INPUT_SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$INPUT_SLOT" ]; then
            INPUT_SLOT="all"
          fi

          # Compute today's date in Indian Standard Time (Asia/Kolkata)
          TODAY=$(TZ="Asia/Kolkata" date +%Y-%m-%d)
          echo "📅 Processing daily schedule for date (IST): $TODAY"
          echo "🎯 Target Run Mode: $INPUT_SLOT"

          run_morning() {
            echo "☀️ [Slot 1/4] Scheduling Morning Puzzle for 7:30 AM IST (${TODAY}T02:00:00Z)..."
            node automate.mjs --slot=morning --schedule="${TODAY}T02:00:00Z" || true
          }

          run_player() {
            echo "👑 [Slot 2/4] Scheduling Guess the GM for 8:30 AM IST (${TODAY}T03:00:00Z)..."
            node automate-player.mjs --schedule="${TODAY}T03:00:00Z" || true
          }

          run_afternoon() {
            echo "☕ [Slot 3/4] Scheduling Afternoon Puzzle for 12:30 PM IST (${TODAY}T07:00:00Z)..."
            node automate.mjs --slot=afternoon --schedule="${TODAY}T07:00:00Z" || true
          }

          run_evening() {
            echo "🌆 [Slot 4/4] Scheduling Evening Puzzle for 5:00 PM IST (${TODAY}T11:30:00Z)..."
            node automate.mjs --slot=evening --schedule="${TODAY}T11:30:00Z" || true
          }

          case "$INPUT_SLOT" in
            "all")
              run_morning
              run_player
              run_afternoon
              run_evening
              ;;
            "morning")
              run_morning
              ;;
            "player")
              run_player
              ;;
            "afternoon")
              run_afternoon
              ;;
            "evening")
              run_evening
              ;;
            *)
              echo "⚠️ Unknown slot '$INPUT_SLOT', running all..."
              run_morning
              run_player
              run_afternoon
              run_evening
              ;;
          esac

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzles.json scratch/player_cache.json || git add puzzles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist puzzle state and replenish stock" && git push)
