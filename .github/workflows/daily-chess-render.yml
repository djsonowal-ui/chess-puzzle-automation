name: Daily Chess Automation

on:
  schedule:
    # Morning: 03:30 UTC (9:00 AM IST)
    - cron: '30 3 * * *'
    # Afternoon: 08:30 UTC (2:00 PM IST)
    - cron: '30 8 * * *'
    # Evening: 13:30 UTC (7:00 PM IST)
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to render and upload (auto, morning, afternoon, evening, all)'
        required: false
        default: 'auto'

# Permissions needed to commit changes back to the repository
permissions:
  contents: write

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 || sudo apt-get install -y libasound2

      - name: Install Node Modules
        run: npm install --legacy-peer-deps

      - name: Setup Headless Chrome for Remotion
        run: npx remotion browser install

      - name: Replenish Puzzles
        run: node replenish.mjs

      - name: Render and Upload Chess Short
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          INPUT_SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$INPUT_SLOT" ]; then
            INPUT_SLOT="auto"
          fi

          CRON_SCHED="${{ github.event.schedule }}"
          if [ "$INPUT_SLOT" = "all" ]; then
            echo "🚀 Running ALL slots (Morning, Afternoon, Evening)..."
            node automate.mjs --slot=morning
            node automate.mjs --slot=afternoon
            node automate.mjs --slot=evening
          elif [ "$INPUT_SLOT" != "auto" ]; then
            echo "🎯 Running manually specified slot: $INPUT_SLOT"
            node automate.mjs --slot=$INPUT_SLOT
          elif [ "$CRON_SCHED" = "30 3 * * *" ]; then
            echo "📅 Scheduled Trigger: Morning Slot (30 3 * * *)"
            node automate.mjs --slot=morning
          elif [ "$CRON_SCHED" = "30 8 * * *" ]; then
            echo "📅 Scheduled Trigger: Afternoon Slot (30 8 * * *)"
            node automate.mjs --slot=afternoon
          elif [ "$CRON_SCHED" = "30 13 * * *" ]; then
            echo "📅 Scheduled Trigger: Evening Slot (30 13 * * *)"
            node automate.mjs --slot=evening
          else
            HOUR=$(date -u +%H)
            echo "📅 Fallback auto-detection based on UTC hour ($HOUR)..."
            if [ "$HOUR" -ge "02" ] && [ "$HOUR" -lt "06" ]; then
              SLOT="morning"
            elif [ "$HOUR" -ge "06" ] && [ "$HOUR" -lt "11" ]; then
              SLOT="afternoon"
            else
              SLOT="evening"
            fi
            echo "✨ Selected Slot: $SLOT"
            node automate.mjs --slot=$SLOT
          fi

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist puzzle state and replenish stock" && git push)
