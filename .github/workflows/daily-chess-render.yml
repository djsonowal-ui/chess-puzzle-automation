name: Daily Chess Automation

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'puzzles.json'
  schedule:
    # 6 AM IST (00:30 UTC) - Run once daily
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual triggering


# Permissions needed to commit changes back to the repository
permissions:
  contents: write

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg build-essential libgbm-dev libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2

      - name: Install Node Modules
        run: npm install --legacy-peer-deps

      - name: Setup Headless Chrome for Remotion
        run: npx remotion browser install

      - name: Replenish Puzzles
        run: node replenish.mjs

      - name: Render Morning Video
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "📅 Processing Morning Video for date: $TODAY"
          node automate.mjs --slot=morning --schedule="${TODAY}T03:30:00Z"

      - name: Render Afternoon Video
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "☀️ Processing Afternoon Video for date: $TODAY"
          node automate.mjs --slot=afternoon --schedule="${TODAY}T08:30:00Z"

      - name: Render Evening Video
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          echo "🌆 Processing Evening Video for date: $TODAY"
          node automate.mjs --slot=evening --schedule="${TODAY}T13:30:00Z"

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add puzzles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: persist puzzle state and replenish stock" && git push)
